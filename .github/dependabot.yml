version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    # Packages that must be upgraded together are grouped for every update
    # type; a lone major bump in these sets cannot install.
    groups:
      vite:
        patterns: ["vite", "@vitejs/*"]
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint"]
      fullcalendar:
        patterns: ["@fullcalendar/*"]
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node's types must match the Node version CI runs (22, set in the
      # workflows' setup-node); bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
