name: Deploy Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    with:
      upload-site: true

  prepare:
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && needs.checks.result == 'success') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      run-id: ${{ steps.select.outputs.run-id }}
    steps:
      - name: Select current main build
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$BUILD_COMMIT" != "$current" ]; then
            echo "Skipping an older main build."
            exit 0
          fi
          echo "commit=$BUILD_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run-id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"

  deploy:
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.commit != ''
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ needs.prepare.outputs.commit }}
          path: dist
          run-id: ${{ needs.prepare.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
